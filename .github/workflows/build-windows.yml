# Сборка kombain-start.exe на серверах GitHub из открытого кода.
# Любой может проверить: exe в релизе собран именно из этого коммита.
name: build-windows

on:
  push:
    branches: [main]
    paths: ["starter/**", ".github/workflows/build-windows.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Тесты
        working-directory: starter
        run: go test ./...

      - name: Иконка, версия и манифест в файл
        working-directory: starter
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --arch amd64

      - name: Сборка (без вырезания служебной информации)
        working-directory: starter
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-H windowsgui" -o ../kombain-start.exe .

      - name: Контрольная сумма
        run: sha256sum kombain-start.exe | tee kombain-start.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: kombain-start
          path: |
            kombain-start.exe
            kombain-start.exe.sha256

      - name: Релиз (только по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kombain-start.exe
            kombain-start.exe.sha256
