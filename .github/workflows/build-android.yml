# Сборка kombain-android.apk на серверах GitHub из открытого кода — как и exe.
# Ядро (вход на сервер, установка прокси и бота) — тот же starter/backend.go, что в exe.
name: build-android

on:
  push:
    branches: [main, android]
    paths: ["android/**", "starter/**", ".github/workflows/build-android.yml", "VERSION"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Версия gomobile. Поднимать только вместе с проверкой APK на телефоне.
  MOBILE_VER: v0.0.0-20260908204917-8b95e45f8d3e

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Тесты ядра
        working-directory: android/core
        run: |
          ./gen.sh
          go mod tidy
          go vet ./...
          go test ./...

      - name: Ядро для Android (kbcore.aar)
        working-directory: android/core
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$MOBILE_VER golang.org/x/mobile/cmd/gobind@$MOBILE_VER
          go get golang.org/x/mobile/bind@$MOBILE_VER
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -target=android/arm64,android/arm -androidapi 26 -o ../app/libs/kbcore.aar .

      - name: Ключ подписи
        env:
          KB_KEYSTORE_B64: ${{ secrets.KB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KB_KEYSTORE_B64" ]; then
            echo "$KB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kombain.jks"
            echo "KB_KEYSTORE_FILE=$RUNNER_TEMP/kombain.jks" >> "$GITHUB_ENV"
            echo "Подпись: постоянный ключ из секретов"
          else
            echo "::warning::Нет секрета KB_KEYSTORE_B64 — APK подписан временным ключом, поверх старого не обновится. Для релиза нужен постоянный ключ."
          fi

      - name: Сборка APK
        working-directory: android/app
        env:
          KB_KEYSTORE_PASS: ${{ secrets.KB_KEYSTORE_PASS }}
        run: |
          set -o pipefail
          if ! gradle --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Причину — наверх, в «Annotations» страницы сборки, чтобы не копаться в журнале.
            grep -E "error:|What went wrong|> |FAILURE|Could not|not found" "$RUNNER_TEMP/gradle.log" | head -25 | sed 's/^/::error::/'
            exit 1
          fi
          cp build/outputs/apk/release/app-release.apk ../../kombain-android.apk

      - name: Контрольная сумма
        run: sha256sum kombain-android.apk | tee kombain-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: kombain-android
          path: |
            kombain-android.apk
            kombain-android.apk.sha256

      - name: Релиз без постоянного ключа не выпускаем
        if: startsWith(github.ref, 'refs/tags/v') && env.KB_KEYSTORE_FILE == ''
        run: |
          echo "::error::Добавь секреты KB_KEYSTORE_B64 и KB_KEYSTORE_PASS — иначе у людей не встанет обновление."
          exit 1

      - name: Релиз (только по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kombain-android.apk
            kombain-android.apk.sha256
